<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f6f7"><title>PrintPilot Precision · Designstudie</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17242c;background:#f5f6f7}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1220px;margin:auto;min-height:100dvh}.header{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;background:#fff;border-bottom:1px solid #e4e8ea}.brand{font-size:20px;font-weight:850;letter-spacing:-.8px}.brand b{color:#00a8ae}.sub{font-size:11px;color:#73838c;font-weight:700;letter-spacing:.08em}.workspace{display:grid;grid-template-columns:215px minmax(0,1fr) 290px;gap:24px;padding:26px}.nav{display:grid;align-content:start;gap:5px}.nav button{border:0;text-align:left;padding:15px;border-radius:10px;color:#64727c;background:transparent;font-weight:700}.nav button.active{background:#1c2a31;color:#fff}.nav button span{font-size:11px;margin-right:11px;opacity:.65}.main{min-width:0}.eyebrow{color:#008f99;font-weight:850;font-size:11px;letter-spacing:.12em}.main h1{font-size:30px;letter-spacing:-1.2px;margin:10px 0 8px}.intro{color:#73838c;font-size:14px;line-height:1.5;margin:0 0 23px}.card,.result{background:#fff;border:1px solid #e2e8eb;border-radius:15px;padding:22px;margin-bottom:15px;box-shadow:0 3px 16px #132c3706}.card h2{font-size:15px;margin:0 0 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:grid;gap:7px;min-width:0}.field label{font-size:12px;font-weight:700;color:#53636c}.field input,.field select{width:100%;height:48px;padding:0 13px;border:1px solid #dce3e7;background:#fbfcfd;border-radius:9px;font-size:16px;color:#1b303a}.field input:focus,.field select:focus{outline:2px solid #8de4e3;border-color:#00a8ae}.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{background:#fbfcfd;border:1px solid #dfe7e9;border-radius:11px;text-align:left;padding:16px;min-height:95px}.tile strong{display:block;font-size:14px}.tile small{display:block;margin-top:7px;color:#788891}.tile.active{border:2px solid #00a8ae;background:#eefbfa;padding:15px}.result h2{font-size:14px;margin:0 0 18px}.stat{border-bottom:1px solid #edf0f2;padding:13px 0;display:flex;justify-content:space-between;gap:12px;font-size:13px}.stat span{color:#71818b}.stat strong{text-align:right;overflow-wrap:anywhere}.result .total{background:#1c2a31;color:white;padding:17px;border-radius:10px;margin-top:20px}.total span{display:block;font-size:11px;color:#afc4cb}.total strong{font-size:21px}.muted{color:#72818a;font-size:12px;line-height:1.6}.bottom{display:flex;justify-content:space-between;gap:10px;margin:20px 0}.btn{border:1px solid #d6e0e4;background:#fff;border-radius:10px;padding:13px 18px;font-weight:800;min-height:48px;color:#263c46}.btn.primary{background:#00a8ae;color:#052d31;border-color:#00a8ae}.link{color:#007d87;font-weight:750}.mobile-status,.mobile-bar{display:none}.hidden{display:none!important}.check{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eef1f2;font-size:14px}.check input{width:20px;height:20px;accent-color:#00a8ae}.notice{padding:14px;background:#f2f7f8;border:1px solid #dcebee;border-radius:10px;font-size:12px;line-height:1.6;color:#526b75}.desktop-only{display:block}
@media(max-width:900px){.workspace{grid-template-columns:1fr;gap:0;padding:0}.nav,.result{display:none}.header{height:56px;padding:0 18px}.header .sub{font-size:10px}.main{padding:0 16px 96px}.main h1{font-size:27px;margin-top:8px}.intro{margin-bottom:17px}.mobile-status{display:block;background:#fff;margin:0 -16px 22px;padding:15px 16px;border-bottom:1px solid #e1e8eb}.mobile-status .line{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800}.mobile-status .line span{color:#008e98}.progress{height:4px;background:#e7eeee;border-radius:9px;margin-top:12px;overflow:hidden}.progress i{display:block;height:100%;background:#00a8ae;width:14%;transition:width .2s}.card{padding:18px;border-radius:12px}.mobile-bar{position:fixed;display:flex;align-items:center;gap:9px;bottom:0;left:0;right:0;padding:11px 16px max(11px,env(safe-area-inset-bottom));background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid #dce6e9;z-index:5}.mobile-bar .btn.primary{flex:1}.bottom{display:none}.desktop-only{display:none}}
@media(max-width:540px){.grid{grid-template-columns:1fr}.tiles{gap:9px}.tile{min-height:90px;padding:13px}.tile.active{padding:12px}.tile strong{font-size:13px}.tile small{font-size:11px}.main h1{font-size:26px}.header .sub{font-size:9px}}
</style></head><body><div class="shell"><header class="header"><div class="brand">PRINT<b>PILOT</b><span class="sub"> / PRECISION</span></div><span class="sub">MIMAKI CJV150-130</span></header><div class="workspace"><nav class="nav" id="nav"></nav><main class="main"><div class="mobile-status"><div class="line"><strong id="mstep">01 / 07</strong><span id="mname">Kunde</span></div><div class="progress"><i id="progress"></i></div></div><div class="eyebrow" id="eyebrow">NEUER AUFTRAG</div><h1 id="title"></h1><p class="intro" id="intro"></p><div id="content"></div><div class="bottom"><button class="btn" id="back">← Zurück</button><button class="btn primary" id="next">Weiter →</button></div></main><aside class="result"><h2>Auftragsübersicht</h2><div id="overview"></div><div class="total"><span>STATUS</span><strong>Entwurf</strong></div><p class="muted">Designstudie. Noch keine vollständige Auftragskalkulation.</p></aside></div></div><div class="mobile-bar"><button class="btn" id="mback">←</button><button class="btn" id="msummary">Übersicht</button><button class="btn primary" id="mnext">Weiter →</button></div><dialog id="summaryDialog" style="border:0;border-radius:16px;width:min(92vw,430px);padding:24px;box-shadow:0 20px 90px #0004"><h2>Auftragsübersicht</h2><div id="mobileOverview"></div><button class="btn primary" style="width:100%;margin-top:18px" id="closeSummary">Schließen</button></dialog><script>
(()=>{'use strict';const $=id=>document.getElementById(id),steps=[['Kunde','Wer beauftragt die Produktion?'],['Produkt','Was möchtest du produzieren?'],['Format','Welche Abmessungen und Auflage?'],['Material','Welches Druckmedium verwenden wir?'],['Verarbeitung','Welche Arbeitsschritte sind erforderlich?'],['Versand','Wie wird der Auftrag übergeben?'],['Kalkulation','Auftragsdaten prüfen und kalkulieren']];const products=[['poster','Poster','Plakate und Einzelmotive'],['banner','Banner','PVC-Banner mit Konfektion'],['rollup','Roll-up','Displaysysteme'],['sticker','Aufkleber','Konturschnitt möglich'],['film','Folie','Beschriftung und Grafik'],['dtf','DTF-Transfer','Fertige Gang Sheets'],['other','Sonstiges','Individuelle Produktion']];const defaults={customer:'',contact:'',job:'',product:'poster',width:'594',height:'841',qty:'1',material:'',finishing:[],ship:'pickup',notes:''};let state;try{state={...defaults,...JSON.parse(localStorage.getItem('printpilot-precision-draft')||'{}')}}catch{state={...defaults}}let step=0;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const persist=()=>localStorage.setItem('printpilot-precision-draft',JSON.stringify(state));const input=(key,label,kind='text')=>'<div class="field"><label for="f_'+key+'">'+label+'</label><input id="f_'+key+'" data-field="'+key+'" type="'+kind+'" value="'+esc(state[key])+'"></div>';const options=(key,label,items)=>'<div class="field"><label for="f_'+key+'">'+label+'</label><select id="f_'+key+'" data-field="'+key+'">'+items.map(([v,t])=>'<option value="'+esc(v)+'" '+(String(state[key])===String(v)?'selected':'')+'>'+esc(t)+'</option>').join('')+'</select></div>';const card=(name,html)=>'<section class="card"><h2>'+name+'</h2>'+html+'</section>';const saved=()=>{try{return JSON.parse(localStorage.getItem('printpilot-v85-import')||'null')?.data||{}}catch{return {}}};const materialList=()=>{const data=saved().mimakiMaterials;return Array.isArray(data)?data.filter(x=>x&&x.id!==undefined).map(x=>[String(x.id),x.name+' · '+x.width+' mm']):[]};function overview(){const rows=[['Kunde',state.customer||'—'],['Produkt',products.find(x=>x[0]===state.product)?.[1]||'—'],['Format',state.width+' × '+state.height+' mm'],['Auflage',state.qty+' Stück'],['Material',materialList().find(x=>x[0]===state.material)?.[1]||'Noch nicht gewählt'],['Übergabe',state.ship==='pickup'?'Abholung':'Versand']];const h=rows.map(([a,b])=>'<div class="stat"><span>'+esc(a)+'</span><strong>'+esc(b)+'</strong></div>').join('');$('overview').innerHTML=h;$('mobileOverview').innerHTML=h}function render(){const [name,description]=steps[step];$('title').textContent=name;$('intro').textContent=description;$('mstep').textContent=String(step+1).padStart(2,'0')+' / 07';$('mname').textContent=name;$('progress').style.width=((step+1)/7*100)+'%';$('nav').innerHTML=steps.map(([n],i)=>'<button data-go="'+i+'" class="'+(i===step?'active':'')+'"><span>'+String(i+1).padStart(2,'0')+'</span>'+n+'</button>').join('');let h='';if(step===0)h=card('Auftragsdaten','<div class="grid">'+input('customer','Kunde / Firma')+input('contact','Ansprechpartner')+input('job','Auftragsbezeichnung')+'</div>');if(step===1)h=card('Produkt auswählen','<div class="tiles">'+products.map(([id,n,d])=>'<button class="tile '+(state.product===id?'active':'')+'" data-product="'+id+'"><strong>'+n+'</strong><small>'+d+'</small></button>').join('')+'</div>');if(step===2)h=card('Produktionsformat','<div class="grid">'+input('width','Breite in mm','number')+input('height','Höhe in mm','number')+input('qty','Auflage / Stück','number')+'</div>');if(step===3){const mats=materialList();h=card('Druckmaterial',mats.length?options('material','Material aus bestehender Datenbank',[['','Bitte wählen'],...mats]):'<div class="notice">Noch keine Materialdaten im neuen Entwurf. Die vollständige bisherige Materialverwaltung bleibt in der Testkalkulation erhalten. Die vorhandene Sicherung kann in Studio v87 importiert werden.</div>')+card('Maschine','<div class="notice"><strong>Mimaki CJV150-130</strong><p>Easy Inks CMYK. Hier werden keine erfundenen Tintenkosten ausgewiesen.</p></div>')}if(step===4){const finishes=state.product==='banner'?['Saum manuell geklebt','Ösen','Endbeschnitt']:state.product==='rollup'?['Roll-up-System montieren','Endbeschnitt']:state.product==='dtf'?['Transferpresse','Gang Sheet zuschneiden']:['Laminieren','Konturschnitt','Endbeschnitt','Ösen'];h=card('Weiterverarbeitung',finishes.map(f=>'<label class="check"><input type="checkbox" data-finish="'+esc(f)+'" '+(state.finishing.includes(f)?'checked':'')+'><span>'+esc(f)+'</span></label>').join(''))}if(step===5)h=card('Übergabe','<div class="grid">'+options('ship','Lieferart',[['pickup','Abholung'],['shipping','Versand']])+input('notes','Hinweise')+'</div>');if(step===6)h=card('Nächster Schritt','<div class="notice"><strong>Diese Seite ist ein neuer, mobilorientierter Designentwurf.</strong> Die vollständigen bestehenden Funktionen für Nutzen, Material, Tinte, DTF, Roll-up, Kalkulation und Dokumente sind weiterhin in der bisherigen Testkalkulation vorhanden. Sie sind hier noch nicht technisch integriert.</div><p><a class="link" href="./index.html">Vollständige bisherige Testkalkulation öffnen →</a></p>')+card('Geplante Integration','<p class="muted">Bestehende Berechnungslogik und Stammdaten werden schrittweise ohne Änderung der Produktivversion übernommen. Bis dahin keine ungeprüften Preisberechnungen.</p>');$('content').innerHTML=h;for(const id of ['back','mback'])$(id).disabled=step===0;for(const id of ['next','mnext'])$(id).textContent=step===6?'Fertig':'Weiter →';overview()}function move(d){if(step===6&&d>0){$('summaryDialog').showModal();return}step=Math.max(0,Math.min(6,step+d));render();window.scrollTo({top:0,behavior:'instant'})}document.addEventListener('input',e=>{const k=e.target.dataset.field;if(k){state[k]=e.target.value;persist();overview()}});document.addEventListener('change',e=>{const k=e.target.dataset.field;if(k){state[k]=e.target.value;persist();overview()}const f=e.target.dataset.finish;if(f){const x=new Set(state.finishing);e.target.checked?x.add(f):x.delete(f);state.finishing=[...x];persist()}});document.addEventListener('click',e=>{const p=e.target.closest('[data-product]');if(p){state.product=p.dataset.product;state.finishing=[];persist();render()}const g=e.target.closest('[data-go]');if(g){step=Number(g.dataset.go);render()}});$('back').onclick=$('mback').onclick=()=>move(-1);$('next').onclick=$('mnext').onclick=()=>move(1);$('msummary').onclick=()=>$('summaryDialog').showModal();$('closeSummary').onclick=()=>$('summaryDialog').close();render()})();
</script></body></html>
