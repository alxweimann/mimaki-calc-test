]');if(add){addOrderItem();return}const remove=e.target.closest('[data-removeitem]');if(remove){const i=Number(remove.dataset.removeitem);order.items.splice(i,1);if(editingIndex===i)editingIndex=-1;else if(editingIndex>i)editingIndex--;saveOrder();render();return}const doc=e.target.closest('[data-orderdoc]');if(doc){orderDoc(doc.dataset.orderdoc);return}const nv=e.target.closest('[data-nestview]');if(nv){nestView=nv.dataset.nestview;refreshNesting();if(step===3)render();return}const p=e.target.closest('[data-product]');if(p){state.product=p.dataset.product;if(state.product==='rollup'){const sys=rollups.find(x=>String(x.id)===String(state.rollSystem))||rollups[0];if(sys){state.rollSystem=String(sys.id);state.width=Number(sys.width);state.height=Number(sys.height)+Number(sys.pull||0)}}store();render()}const n=e.target.closest('[data-step]');if(n){step=Number(n.dataset.step);render()}});document.addEventListener('input',e=>{const key=e.target.dataset.field;if(key){state[key]=e.target.value;if((key==='customer'||key==='job')&&order.items.length){order[key==='customer'?'customer':'name']=state[key];saveOrder()}store();summary();refreshNesting();if(state.product==='dtf'&&step===3)render()}});document.addEventListener('change',e=>{const key=e.target.dataset.field;if(key){state[key]=e.target.value;if(key==='rollSystem'){const sys=rollups.find(x=>String(x.id)===String(state.rollSystem));if(sys){state.width=Number(sys.width);state.height=Number(sys.height)+Number(sys.pull||0)}}store();render()}const check=e.target.dataset.check;if(check){state[check]=e.target.checked;store();render()}});$('back').onclick=$('mobileBack').onclick=()=>go(-1);$('next').onclick=$('mobileNext').onclick=()=>go(1);$('mobileSummary').onclick=()=>$('resultDialog').showModal();$('closeDialog').onclick=()=>$('resultDialog').close();render()})();
