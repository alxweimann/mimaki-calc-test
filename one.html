function summary(){const p=plan(),m=activeMaterial();let rows=[['Produkt',products.find(x=>x[0]===state.product)?.[1]||'—'],['Format',state.width+' × '+state.height+' mm'],['Auflage',state.qty+' Stück'],['Material',m?.name||'—']];if(p)rows.push(['Nutzen',p.across+' nebeneinander / '+p.rows+' Reihen'],['Rollenverbrauch',p.lm.toFixed(2)+' lfm']);const html=rows.map(([a,b])=>'<div class="line"><span>'+esc(a)+'</span><strong>'+esc(b)+'</strong></div>').join('');$('desktopSummary').innerHTML=$('dialogSummary').innerHTML=html;const price=p&&p.valid?money(p.net):'Noch offen';$('desktopPrice').textContent=$('dialogPrice').textContent=price}function render(){const [title,desc]=stages[step];$('heading').textContent=step===0?'Was drucken wir?':title;$('description').textContent=desc;$('mobileCount').textContent=String(step+1).padStart(2,'0')+' / 04';$('mobileTitle').textContent=title;$('progress').style.width=((step+1)/4*100)+'%';$('sidebar').innerHTML=stages.map(([n],i)=>'<button class="'+(i===step?'active':'')+'" data-step="'+i+'"><span>'+String(i+1).padStart(2,'0')+'</span>'+n+'</button>').join('');let h='';if(step===0)h=panel('Produkt auswählen','<div class="products">'+products.map(([id,n,icon])=>'<button class="product '+(state.product===id?'active':'')+'" data-product="'+id+'"><span class="glyph">'+icon+'</span><strong>'+n+'</strong></button>').join('')+'</div>')+panel('Auftrag (optional)','<div class="fields">'+textField('customer','Kunde')+textField('job','Auftragsbezeichnung')+'</div>');if(step===1)h=panel('Format und Menge','<div class="fields">'+field('width','Breite','mm')+field('height','Höhe','mm')+field('qty','Auflage','Stück')+select('material','Druckmaterial',mats.map(m=>[String(m.id),m.name+' · '+m.width+' mm']))+'</div>')+panel('Nutzenparameter','<div class="fields">'+field('bleed','Beschnitt je Seite','mm')+field('gap','Zwischenschnitt','mm')+field('margin','Rand je Seite','mm')+select('orientation','Ausrichtung',[['auto','Automatisch'],['0','0°'],['90','90°']])+'</div>')+'<div id="nestingLive">'+nestingMarkup()+'</div>';if(step===2){const banner=state.product==='banner',sticker=state.product==='sticker'||state.product==='film',roll=state.product==='rollup',dtf=state.product==='dtf';h=panel('Weiterverarbeitung',check('lam','Laminieren')+(state.lam?'<div class="fields">'+select('laminate','Laminat',lams.map(l=>[String(l.id),l.name]))+field('lamWork','Laminierarbeit','€/m²')+'</div>':'')+(sticker?check('contour','Konturschnitt')+(state.contour?field('contourUnit','Konturschnitt','€/Stück'):''):'')+(banner?check('manualHem','Saum von Hand kleben')+(state.manualHem?field('hemUnit','Saum','€/Stück'):'')+check('eye','Ösen')+(state.eye?'<div class="fields">'+field('eyeQty','Ösen je Stück')+field('eyeUnit','Öse inkl. Arbeit','€/Öse')+'</div>':''):'')+check('trim','Endbeschnitt von Hand')+(state.trim?'<div class="fields">'+field('trimQty','Schnitte gesamt')+field('trimUnit','Preis je Schnitt','€')+'</div>':'')+(roll?field('rollupUnit','Roll-up-System / Montage','€/Stück'):'')+(dtf?field('pressUnit','Transferarbeit','€/Stück'):'')+'</div>')}if(step===3){const p=plan();h=nestingMarkup()+panel('Material und Nutzen',p?'<div class="line"><span>Nutzen pro Reihe</span><strong>'+p.across+'</strong></div><div class="line"><span>Reihen</span><strong>'+p.rows+'</strong></div><div class="line"><span>Ausrichtung</span><strong>'+(p.rot?'90°':'0°')+'</strong></div><div class="line"><span>Rollenverbrauch</span><strong>'+p.lm.toFixed(3)+' lfm</strong></div>':'<div class="notice">Das Format passt mit den aktuellen Einstellungen nicht auf die Rolle oder die Eingaben sind unvollständig.</div>')+panel('Maschinen- und Kalkulationswerte','<div class="fields">'+field('machineRate','Maschinenkosten','€/m²')+field('cleanRate','Reinigung / Wartung','€/m²')+field('factor','Kalkulationsfaktor')+field('minimum','Mindestpreis','€')+field('shipping','Versand','€')+'</div>')+panel('Tintenverbrauch · tatsächlich gemessen','<p class="help">Hier nur reale Verbrauchswerte in ml für den gesamten Auftrag eintragen. Ohne diese Werte wird kein vollständiger Verkaufspreis angezeigt.</p><div class="fields">'+field('inkC','Cyan','ml')+field('inkM','Magenta','ml')+field('inkY','Yellow','ml')+field('inkK','Black','ml')+'</div>')+(p?panel('Kostenpositionen',p.parts.map(([n,v])=>'<div class="line"><span>'+esc(n)+'</span><strong>'+money(v)+'</strong></div>').join('')+'<div class="line"><span>Zwischensumme</span><strong>'+money(p.subtotal)+'</strong></div>'+(p.valid?'<div class="price"><small>VERKAUFSPREIS NETTO</small><strong>'+money(p.net)+'</strong></div>':'<div class="notice">Preis noch nicht vollständig: Für die Tinte fehlen gemessene CMYK-Verbrauchswerte oder gültige Stammdaten. Keine pauschale Durchschnittsberechnung.</div>')):'')+panel('Vollständige Funktionen','<p class="help">Diese Neufassung enthält eine erste direkte Kalkulation. Die bestehende Testversion enthält weiterhin die ausführlichen Funktionen für Roll-up-Systemdatenbank, DTF-Gang-Sheets, Ösenzeichnung, Nutzenvorschau, Versand und Auftragsdokumente. Diese werden schrittweise übernommen.</p><a href="./index.html" style="color:#008e96;font-weight:800">Bisherige vollständige Testkalkulation öffnen →</a>')} $('content').innerHTML=h;for(const id of ['back','mobileBack'])$(id).disabled=step===0;for(const id of ['next','mobileNext'])$(id).textContent=step===3?'Ergebnis':'Weiter →';summary()}function go(d){if(step===3&&d>0){$('resultDialog').showModal();return}step=Math.max(0,Math.min(3,step+d));render();window.scrollTo({top:0,behavior:'instant'})}document.addEventListener('click',e=>{const nv=e.target.closest('[data-nestview]');if(nv){nestView=nv.dataset.nestview;refreshNesting();if(step===3)render();return}const p=e.target.closest('[data-product]');if(p){state.product=p.dataset.product;store();render()}const n=e.target.closest('[data-step]');if(n){step=Number(n.dataset.step);render()}});document.addEventListener('input',e=>{const key=e.target.dataset.field;if(key){state[key]=e.target.value;store();summary();refreshNesting()}});document.addEventListener('change',e=>{const key=e.target.dataset.field;if(key){state[key]=e.target.value;store();render()}const check=e.target.dataset.check;if(check){state[check]=e.target.checked;store();render()}});$('back').onclick=$('mobileBack').onclick=()=>go(-1);$('next').onclick=$('mobileNext').onclick=()=>go(1);$('mobileSummary').onclick=()=>$('resultDialog').showModal();$('closeDialog').onclick=()=>$('resultDialog').close();render()})();
</script></body></html>
